<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#0a0f17" />
<title>ACC City — Loading</title>
<style>
html,body{margin:0;min-height:100%;background:#080c12;color:#edf5ff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}body{display:grid;place-items:center;padding:24px}.box{text-align:center}.logo{width:58px;height:58px;margin:0 auto 14px;border-radius:18px;display:grid;place-items:center;font-size:28px;font-weight:900;background:linear-gradient(145deg,#6ea8ff,#a67bff)}.muted{color:#8ea0b8;font-size:13px}
</style>
</head>
<body>
<div class="box"><div class="logo">A</div><h2>ACC City</h2><div id="status" class="muted">กำลังเข้าสู่เมือง…</div></div>
<script>
(async()=>{try{
 const files=['payload-01.txt','payload-02.txt','payload-03.txt','payload-04.txt','payload-05.txt'];
 const parts=await Promise.all(files.map(async f=>{const r=await fetch(f+'?v=20260912-1343');if(!r.ok)throw new Error('โหลด '+f+' ไม่สำเร็จ');return (await r.text()).trim()}));
 const b64=parts.join('');
 const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
 if(!('DecompressionStream' in window))throw new Error('เบราว์เซอร์นี้ไม่รองรับการโหลด ACC City เวอร์ชันนี้');
 const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
 const html=await new Response(stream).text();
 document.open();document.write(html);document.close();
}catch(err){console.error(err);document.getElementById('status').textContent='เปิด ACC City ไม่สำเร็จ กรุณารีเฟรชหน้าอีกครั้ง';}
})();
</script>
</body>
</html>
