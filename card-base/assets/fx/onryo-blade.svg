<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 420" role="img" aria-label="Onryo katana">
  <defs>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ff"/>
      <stop offset=".34" stop-color="#d8b8ff"/>
      <stop offset=".68" stop-color="#b747ff"/>
      <stop offset="1" stop-color="#ff345f"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5c7c"/>
      <stop offset=".48" stop-color="#c74dff"/>
      <stop offset="1" stop-color="#7f2cff"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-20%" width="260%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b1"/>
      <feColorMatrix in="b1" type="matrix" values="1 0 0 0 0.45  0 0.25 0 0 0  0 0 1 0 0.5  0 0 0 .9 0" result="g1"/>
      <feMerge><feMergeNode in="g1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <!-- handle, copied in spirit from the crossed-katana reference -->
    <rect x="43" y="8" width="34" height="118" rx="9" fill="#120816" stroke="#cf7aff" stroke-width="2"/>
    <g fill="#f3eaff" opacity=".9">
      <path d="M48 18l12 10-12 10 7 5 12-10 10 9v-13L66 19l11-9H62z"/>
      <path d="M48 48l12 10-12 10 7 5 12-10 10 9V59L66 49l11-9H62z"/>
      <path d="M48 78l12 10-12 10 7 5 12-10 10 9V89L66 79l11-9H62z"/>
      <path d="M48 108l12 10-8 7h16l9-8-11-9 11-9H62z"/>
    </g>
    <rect x="32" y="121" width="56" height="8" rx="4" fill="#35113d" stroke="#ff4f75" stroke-width="2"/>
    <path d="M47 128h26l-4 17H51z" fill="#1b0b22" stroke="#c36bff" stroke-width="1.6"/>
    <!-- long curved blade -->
    <path d="M53 142
             C54 222 49 307 30 382
             C26 397 19 408 10 415
             C31 412 48 402 60 387
             C87 351 92 272 76 144 Z"
          fill="url(#blade)" opacity=".92"/>
    <path d="M58 145
             C63 224 58 313 39 385
             C35 399 28 408 18 414"
          fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" opacity=".92"/>
    <path d="M74 144
             C89 260 84 341 60 388"
          fill="none" stroke="url(#edge)" stroke-width="4.2" stroke-linecap="round" opacity=".92"/>
  </g>
</svg>