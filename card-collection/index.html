<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111318">
<title>Digital Card Collection</title>
<style>
html,body{margin:0;min-height:100%;background:#090b0f;color:#fff;font-family:system-ui,sans-serif}
body{display:grid;place-items:center}
.boot{opacity:.72;letter-spacing:.12em;font-size:12px}
.err{max-width:760px;padding:24px;white-space:pre-wrap;line-height:1.6;color:#ffccd2}
</style>
</head>
<body>
<div class="boot">LOADING ARCHIVE…</div>
<script>
(async()=>{
  const showError=(e)=>{document.body.innerHTML='<pre class="err">Unable to load app\n'+String(e&&e.message||e)+'</pre>'};
  try{
    const url='./app.html.gz?v=20260902-2300';
    const r=await fetch(url,{cache:'no-store'});
    if(!r.ok) throw new Error('App file HTTP '+r.status+' '+r.statusText);

    const bytes=new Uint8Array(await r.arrayBuffer());
    let text;

    // Some static hosts transparently decode .gz responses.
    if(bytes.length>=2 && bytes[0]===0x1f && bytes[1]===0x8b){
      if(typeof DecompressionStream!=='function') throw new Error('Browser does not support gzip decompression');
      const ds=new DecompressionStream('gzip');
      text=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();
    }else{
      text=new TextDecoder('utf-8').decode(bytes);
    }

    const probe=text.slice(0,300).toLowerCase();
    if(!probe.includes('<!doctype') && !probe.includes('<html')){
      throw new Error('App payload was loaded but is not valid HTML');
    }

    document.open();
    document.write(text);
    document.close();
  }catch(e){
    console.error(e);
    showError(e);
  }
})();
</script>
</body>
</html>
