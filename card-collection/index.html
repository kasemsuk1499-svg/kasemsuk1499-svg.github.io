<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111318">
<title>Digital Card Collection</title>
<style>html,body{margin:0;min-height:100%;background:#090b0f;color:#fff;font-family:system-ui,sans-serif}body{display:grid;place-items:center}.boot{opacity:.72;letter-spacing:.12em;font-size:12px}</style>
</head>
<body><div class="boot">LOADING ARCHIVE…</div>
<script>
(async()=>{
  try{
    const r=await fetch('./app.html.gz',{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const ds=new DecompressionStream('gzip');
    const html=await new Response(r.body.pipeThrough(ds)).text();
    document.open(); document.write(html); document.close();
  }catch(e){
    document.body.innerHTML='<pre style="white-space:pre-wrap;padding:24px">Unable to load app: '+String(e.message||e)+'</pre>';
  }
})();
</script></body></html>
